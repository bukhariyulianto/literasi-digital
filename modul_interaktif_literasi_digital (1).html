<!DOCTYPE html>
<html lang="id" class="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; /* Strict No Scroll */
            touch-action: none; /* Prevent browser swipe-to-refresh */
            background-color: #f3f4f6;
        }
        
        .dark body {
            background-color: #111827;
        }

        /* Slide Transitions */
        .slide-container {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark .glass {
            background: rgba(31, 41, 55, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Fact Box Animation */
        @keyframes pulse-border {
            0% { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }
            50% { border-color: rgba(59, 130, 246, 0.8); box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .fact-box {
            animation: pulse-border 3s infinite;
        }

        /* Text balance to prevent orphans */
        h1, h2, h3, p {
            text-wrap: balance;
        }

        /* Hide scrollbar for internal content if strictly needed */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

            {

                q: 'Berdasarkan materi, mahasiswa saat ini dituntut untuk tidak hanya menjadi "Pengguna Cerdas", tetapi berevolusi menjadi apa?',

        // --- STATE MANAGEMENT ---
        let currentSlide = 0;
        let isDarkMode = false;
        let isSoundOn = true;
        let score = 0;

        // --- DOM ELEMENTS ---
        const slider = document.getElementById('slider');
        const progressContainer = document.getElementById('progress-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnTheme = document.getElementById('btn-theme');
        const btnSound = document.getElementById('btn-sound');
        const html = document.documentElement;

        // --- AUDIO ENGINE (Web Audio API - No External Files) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if (!isSoundOn) return;
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            tap: () => playTone(600, 'sine', 0.1, 0.05),
            correct: () => {
                playTone(523.25, 'sine', 0.1, 0.1); // C5
                setTimeout(() => playTone(659.25, 'sine', 0.2, 0.1), 100); // E5
                setTimeout(() => playTone(783.99, 'sine', 0.4, 0.1), 200); // G5
            },
            wrong: () => {
                playTone(300, 'sawtooth', 0.2, 0.05);
                setTimeout(() => playTone(250, 'sawtooth', 0.3, 0.05), 150);
            },
            finish: () => {
                playTone(440, 'square', 0.2, 0.05);
                setTimeout(() => playTone(554, 'square', 0.2, 0.05), 200);
                setTimeout(() => playTone(659, 'square', 0.4, 0.05), 400);
            }

            renderSlides();
            renderProgress();
            updateView();

                if(e.key === 'ArrowRight') navigate(1);
                if(e.key === 'ArrowLeft') navigate(-1);
            });

            btnTheme.addEventListener('click', toggleTheme);
            btnSound.addEventListener('click', toggleSound);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if(isDarkMode) {
                html.classList.add('dark');
                btnTheme.innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>';
            } else {
                html.classList.remove('dark');
                btnTheme.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
            sounds.tap();
        }

        function toggleSound() {
            isSoundOn = !isSoundOn;
            if(isSoundOn) {
                btnSound.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                sounds.tap();
            } else {
                btnSound.innerHTML = '<i class="fa-solid fa-volume-xmark text-red-500"></i>';

                            <h1 class="text-2xl md:text-3xl font-bold mb-2 text-center text-brand-600 dark:text-brand-400">${slide.title}</h1>

                            <div class="flex-grow overflow-y-auto no-scrollbar mb-4 text-sm md:text-base leading-relaxed text-gray-700 dark:text-gray-200">

                                    <div>

                                        <p class="text-xs text-gray-600 dark:text-gray-400 font-medium">${slide.fact}</p>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    `;
                } else if (slide.type === 'quiz_intro') {
                    contentHTML = `
                        <div class="glass p-8 rounded-3xl w-full max-w-lg text-center slide-content opacity-0 scale-95 transition-all duration-500">

                    contentHTML = `

                } else if (slide.type === 'result') {
                    contentHTML = `
                        <div class="glass p-8 rounded-3xl w-full max-w-lg text-center slide-content opacity-0 scale-95 transition-all duration-500">
                            <div id="result-icon" class="text-7xl mb-6">🏆</div>
                            <h2 class="text-3xl font-bold mb-2 text-gray-800 dark:text-white">Modul Selesai!</h2>
                            <p class="text-gray-500 dark:text-gray-400 mb-6">Skor Akhir Anda:</p>
                            <div class="text-6xl font-black text-brand-600 dark:text-brand-400 mb-8"><span id="final-score">0</span>/3</div>
                            <p id="result-msg" class="mb-8 font-medium text-gray-700 dark:text-gray-200"></p>
                            <button onclick="location.reload()" class="relative z-50 px-8 py-3 bg-gray-800 dark:bg-white text-white dark:text-gray-900 rounded-full font-bold shadow-lg transition-transform active:scale-95">
                                <i class="fa-solid fa-rotate-right mr-2"></i> Ulangi Modul
                            </button>
                        </div>
                    `;
                }

                slideDiv.innerHTML = contentHTML;
                slider.appendChild(slideDiv);
            });
        }

        function renderProgress() {
            progressContainer.innerHTML = '';
            const total = slidesData.length;
            for(let i = 0; i < total; i++) {
                const bar = document.createElement('div');
                bar.className = 'flex-1 rounded-full bg-gray-300 dark:bg-gray-700 relative overflow-hidden';
                const fill = document.createElement('div');
                fill.className = 'absolute top-0 left-0 h-full w-0 bg-brand-500 transition-all duration-300 ease-linear';
                fill.id = `prog-fill-${i}`;
                bar.appendChild(fill);
                progressContainer.appendChild(bar);
            }
        }

        function updateView() {
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Mengatur Visibilitas Tombol Navigasi Bawah
            if (currentSlide === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            if (currentSlide === slidesData.length - 1) {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');
            }

            for(let i=0; i<slidesData.length; i++) {
                const fill = document.getElementById(`prog-fill-${i}`);
                if(i < currentSlide) fill.style.width = '100%';
                else if(i === currentSlide) fill.style.width = '100%'; 
                else fill.style.width = '0%';
            }

            document.querySelectorAll('.slide-content').forEach((el, idx) => {
                if(idx === currentSlide) {
                    setTimeout(() => {
                        el.classList.remove('opacity-0', 'scale-95');
                        el.classList.add('opacity-100', 'scale-100');
                    }, 50);
                } else {
                    el.classList.remove('opacity-100', 'scale-100');
                    el.classList.add('opacity-0', 'scale-95');
                }
            });

            if(slidesData[currentSlide].type === 'result') {
                document.getElementById('final-score').innerText = score;
                const msg = document.getElementById('result-msg');
                const icon = document.getElementById('result-icon');
                if(score === 3) {
                    msg.innerText = "Luar biasa! Anda siap menjadi Digital Innovator.";
                    icon.innerText = "🌟";
                    sounds.finish();
                } else if(score >= 1) {
                    msg.innerText = "Pemahaman yang baik, terus tingkatkan literasi digital Anda.";
                    icon.innerText = "👍";
                } else {
                    msg.innerText = "Jangan menyerah! Mari baca ulang materinya.";
                    icon.innerText = "💪";
                }
            }
        }

        window.navigate = function(dir) {
            if (dir > 0 && slidesData[currentSlide].type === 'quiz') {
                const feedback = document.getElementById(`feedback-${currentSlide}`);
                if (feedback.classList.contains('hidden')) {
                    const btns = document.querySelectorAll(`.quiz-btn-${currentSlide}`);
                    btns.forEach(btn => {
                        btn.classList.add('animate-pulse');
                        setTimeout(() => btn.classList.remove('animate-pulse'), 500);
                    });
                    
                    // Efek getar juga pada tombol Lanjut jika belum menjawab
                    btnNext.classList.add('animate-pulse', 'bg-red-500');
                    setTimeout(() => btnNext.classList.remove('animate-pulse', 'bg-red-500'), 500);
                    
                    sounds.wrong();
                    return;
                }
            }

            const newSlide = currentSlide + dir;
            if (newSlide >= 0 && newSlide < slidesData.length) {
                currentSlide = newSlide;
                sounds.tap();
                updateView();
            }
        };

        window.handleAnswer = function(slideIndex, optIndex) {
            const slide = slidesData[slideIndex];
            const btns = document.querySelectorAll(`.quiz-btn-${slideIndex}`);
            const feedback = document.getElementById(`feedback-${slideIndex}`);
            const nextBtn = document.getElementById(`next-quiz-${slideIndex}`);

            btns.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:border-brand-500');
            });

            const isCorrect = (optIndex === slide.correct);
            const selectedBtn = btns[optIndex];
            selectedBtn.classList.remove('opacity-50');

            feedback.classList.remove('hidden');

            if (isCorrect) {
                score++;
                selectedBtn.classList.add('bg-green-100', 'border-green-500', 'dark:bg-green-900/40', 'dark:border-green-500');
                feedback.innerHTML = `<i class="fa-solid fa-circle-check text-green-500 mr-2"></i> <span class="text-green-700 dark:text-green-400"><b>Benar!</b> ${slide.explanation}</span>`;
                feedback.classList.add('bg-green-50', 'dark:bg-green-900/20');
                sounds.correct();
            } else {
                selectedBtn.classList.add('bg-red-100', 'border-red-500', 'dark:bg-red-900/40', 'dark:border-red-500');
                btns[slide.correct].classList.remove('opacity-50');
                btns[slide.correct].classList.add('border-green-500', 'border-2'); 
                
                feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-red-500 mr-2"></i> <span class="text-red-700 dark:text-red-400"><b>Kurang tepat.</b> ${slide.explanation}</span>`;
                feedback.classList.add('bg-red-50', 'dark:bg-red-900/20');
                sounds.wrong();
            }

            nextBtn.classList.remove('hidden');
        };

        // Initialize on load
        window.onload = initApp;

    </script>
</body>
</html>
